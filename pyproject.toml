[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-lab"
version = "0.1.0"
description = "A reproducible RAG and applied ML portfolio project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3,<2", "numpy>=1.24,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
llm = ["openai>=1.30,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ai-lab = "ai_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
